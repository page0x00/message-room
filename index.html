<!doctype html>
<html lang="zh-CN" data-theme="clean">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f7f7f5" />
    <meta name="referrer" content="no-referrer" />
    <meta name="application-version" content="2.0.0-20260920" />
    <title>小小留言室</title>
    <link rel="stylesheet" href="./styles.css?v=2.0.0-20260920" />
    <script src="./vendor/supabase.js?v=2.57.4"></script>
  </head>
  <body>
    <div class="app-shell">
      <section id="home" class="screen home active" aria-labelledby="homeTitle">
        <header class="home-head">
          <button
            class="round-btn"
            id="themeBtn"
            type="button"
            aria-label="切换主题"
          >
            ◐
          </button>
        </header>
        <main class="home-main">
          <div class="brand-mark" aria-hidden="true">✉</div>
          <p class="eyebrow" id="dailyCopy">有些话，晚一点抵达也没关系。</p>
          <h1 id="homeTitle">小小留言室</h1>
          <p class="home-sub">留一封不会被消息流冲走的信。</p>
          <div class="home-actions">
            <button class="btn primary" id="createBtn" type="button">
              创建房间
            </button>
            <button class="btn ghost" id="joinToggle" type="button">
              加入已有房间
            </button>
          </div>
          <form class="join-box" id="joinForm" hidden>
            <input
              id="roomInput"
              autocomplete="off"
              placeholder="粘贴房间链接或输入房间号"
              aria-label="房间链接或房间号"
            />
            <button class="btn primary" type="submit">进入</button>
          </form>
          <section class="recent" id="recentSection" hidden>
            <div class="section-title">
              <span>最近加入</span
              ><button id="clearRecent" type="button">清空</button>
            </div>
            <div class="room-list" id="roomList"></div>
          </section>
        </main>
      </section>
      <section id="room" class="screen room-screen" aria-label="留言房间">
        <header class="topbar">
          <button
            class="round-btn"
            id="backBtn"
            type="button"
            aria-label="返回"
          >
            ‹
          </button>
          <button
            class="room-heading"
            id="roomInfoBtn"
            type="button"
            aria-label="查看房间资料"
          >
            <strong id="roomTitle">留言室</strong
            ><small id="roomStatus">正在连接</small>
          </button>
          <button
            class="round-btn"
            id="menuBtn"
            type="button"
            aria-label="更多"
          >
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <circle cx="5" cy="12" r="1.7" />
              <circle cx="12" cy="12" r="1.7" />
              <circle cx="19" cy="12" r="1.7" />
            </svg>
          </button>
        </header>
        <nav class="view-tabs" aria-label="查看方式">
          <button class="active" data-view="chat" type="button">聊天</button
          ><button data-view="diary" type="button">日记</button
          ><button data-view="wall" type="button">回忆墙</button>
        </nav>
        <div class="connection-note" id="connectionNote" role="status"></div>
        <div class="history-tools">
          <span id="historyCount"></span
          ><button id="refreshBtn" type="button">刷新</button
          ><button id="olderBtn" type="button" hidden>加载更早留言</button>
        </div>
        <main
          class="messages view-chat"
          id="messages"
          aria-label="留言列表"
        ></main>
        <aside class="quote-tray" id="quoteTray" hidden>
          <div>
            <strong id="quoteCount">引用 0 条</strong
            ><span id="quotePreview"></span>
          </div>
          <button id="clearQuotes" type="button" aria-label="清除引用">
            ×
          </button>
        </aside>
        <form class="composer" id="composer">
          <button
            class="composer-tool"
            id="dateBtn"
            type="button"
            aria-label="设置显示日期"
          >
            ＋
          </button>
          <textarea
            id="messageInput"
            rows="1"
            maxlength="5000"
            placeholder="写点什么……"
            aria-label="留言内容"
          ></textarea>
          <button class="send-btn" id="sendBtn" type="submit">发送</button>
        </form>
      </section>
    </div>
    <div class="scrim" id="menuScrim" hidden>
      <section
        class="sheet menu-sheet"
        role="dialog"
        aria-modal="true"
        aria-label="房间菜单"
      >
        <button id="shareBtn" type="button">复制房间链接</button
        ><button id="profileBtn" type="button">双方昵称与头像</button
        ><button id="themeMenuBtn" type="button">切换界面风格</button
        ><button id="leaveBtn" type="button">返回首页</button
        ><button class="sheet-cancel" data-close="menuScrim" type="button">
          取消
        </button>
      </section>
    </div>
    <div class="scrim" id="profileScrim" hidden>
      <section
        class="sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="profileTitle"
      >
        <header class="sheet-head">
          <h2 id="profileTitle">房间里的我们</h2>
          <button data-close="profileScrim" type="button">×</button>
        </header>
        <p class="sheet-note" id="profileNote"></p>
        <div class="profile-grid">
          <div class="avatar-field">
            <label
              ><span>我的头像</span
              ><input id="myAvatar" accept="image/*" type="file" /><span
                class="avatar-picker"
                id="myAvatarPreview"
                >我</span
              ></label
            ><button class="avatar-reset" id="clearMyAvatar" type="button">
              还原头像
            </button>
          </div>
          <label class="field"
            ><span>我的昵称</span
            ><input id="myName" maxlength="24" placeholder="我"
          /></label>
          <div class="avatar-field">
            <label
              ><span>对方头像</span
              ><input id="otherAvatar" accept="image/*" type="file" /><span
                class="avatar-picker"
                id="otherAvatarPreview"
                >友</span
              ></label
            ><button class="avatar-reset" id="clearOtherAvatar" type="button">
              还原头像
            </button>
          </div>
          <label class="field"
            ><span>对方备注（仅本机）</span
            ><input id="otherName" maxlength="24" placeholder="使用对方的昵称"
          /></label>
        </div>
        <button class="btn primary wide" id="saveProfile" type="button">
          保存
        </button>
      </section>
    </div>
    <div class="scrim" id="dateScrim" hidden>
      <section
        class="sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="dateTitle"
      >
        <header class="sheet-head">
          <h2 id="dateTitle">这封信显示在哪一天？</h2>
          <button
            data-close="dateScrim"
            type="button"
            aria-label="关闭日期设置"
          >
            ×
          </button>
        </header>
        <label class="field"
          ><span>显示日期</span><input id="displayDate" type="date"
        /></label>
        <p class="sheet-note">
          只改变日记与回忆墙里的展示日期，不会篡改真实发送时间。留空即使用发送当天。
        </p>
        <button class="btn primary wide" id="saveDate" type="button">
          使用这个日期
        </button>
      </section>
    </div>
    <div class="scrim" id="noticeScrim" hidden>
      <section
        class="sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="noticeTitle"
      >
        <header class="sheet-head"><h2 id="noticeTitle">提示</h2></header>
        <p class="notice-body" id="noticeBody"></p>
        <input id="noticeLink" readonly hidden aria-label="房间链接" />
        <div class="notice-actions">
          <button class="btn ghost" id="noticeCancel" type="button">取消</button
          ><button class="btn primary" id="noticeConfirm" type="button">
            确定
          </button>
        </div>
      </section>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <noscript>留言室需要浏览器启用 JavaScript。</noscript>
    <script type="module" src="./app.js?v=2.0.0-20260920"></script>
  </body>
</html>
