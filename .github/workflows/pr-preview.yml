name: PR branch preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Checkout pull request
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source

      - name: Configure git
        run: |
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish preview
        if: github.event.action != 'closed'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          target="pages/pr-preview/pr-${PR_NUMBER}"
          rm -rf "$target"
          mkdir -p "$target"
          rsync -a source/ "$target/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'supabase/' \
            --exclude 'tests/' \
            --exclude 'node_modules/' \
            --exclude 'docs/' \
            --exclude 'README.md' \
            --exclude 'SETUP.md' \
            --exclude 'package.json' \
            --exclude 'package-lock.json'
          touch pages/.nojekyll
          git -C pages add -A
          if ! git -C pages diff --cached --quiet; then
            git -C pages commit -m "Preview PR #${PR_NUMBER}"
            git -C pages push origin gh-pages
          fi

      - name: Remove closed preview
        if: github.event.action == 'closed'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          rm -rf "pages/pr-preview/pr-${PR_NUMBER}"
          git -C pages add -A
          if ! git -C pages diff --cached --quiet; then
            git -C pages commit -m "Remove preview PR #${PR_NUMBER}"
            git -C pages push origin gh-pages
          fi

      - name: Post preview link
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- message-room-preview -->';
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-preview/pr-${context.issue.number}/`;
            const body = `${marker}\n分支预览：${url}\n\n这个地址只用于验收当前 PR，不需要先合并到 main。`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const old = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (old) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: old.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
